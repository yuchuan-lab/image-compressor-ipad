<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>圖片處理標本室｜嶼川標本室</title>

  <style>
    :root {
      --paper: #f4f0e4;
      --paper-light: #faf7ed;
      --paper-dark: #e8e2d3;

      --olive: #69704d;
      --olive-dark: #4f563b;
      --olive-light: #899071;

      --brown: #756c5b;
      --text: #3e4038;
      --muted: #8b897d;

      --line: #cbc5b5;
      --line-dark: #aaa392;

      --shadow: rgba(70, 68, 55, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          rgba(255,255,255,0.18),
          rgba(255,255,255,0.18)
        ),
        var(--paper);

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Helvetica Neue",
        sans-serif;

      padding: 42px 20px 55px;
    }

    .app {
      width: min(100%, 820px);
      margin: 0 auto;
    }

    /* =========================
       HEADER
       ========================= */

    header {
      margin-bottom: 34px;
    }

    .archive-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);

      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .archive-number {
      color: var(--olive);
    }

    .title-area {
      padding: 25px 4px 18px;
    }

    .eyebrow {
      margin-bottom: 9px;

      color: var(--olive);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    /* ===== 礦石圖示 + 標題 ===== */

    .title-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .mineral-icon {
      flex: 0 0 auto;

      width: 43px;
      height: 50px;

      color: var(--olive-dark);

      opacity: 0.9;
    }

    .mineral-icon svg {
      width: 100%;
      height: 100%;

      display: block;

      overflow: visible;
    }

    .mineral-icon path,
    .mineral-icon line,
    .mineral-icon polygon {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.25;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    h1 {
      margin: 0;

      color: var(--olive-dark);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(28px, 6vw, 42px);
      font-weight: 500;
      letter-spacing: 0.08em;
      line-height: 1.2;
    }

    .title-en {
      margin-top: 8px;

      color: var(--brown);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 14px;

      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      line-height: 1.7;
    }

    /* =========================
       SPECIMEN INTAKE
       ========================= */

    .section-label {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 9px;

      color: var(--brown);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .section-label::before {
      content: "";
      width: 20px;
      height: 1px;
      background: var(--olive);
    }

    .drop-area {
      position: relative;

      min-height: 255px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.3),
          rgba(232,226,211,0.22)
        );

      border: 1px solid var(--line-dark);

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .drop-area::before,
    .drop-area::after {
      content: "";
      position: absolute;

      width: 16px;
      height: 16px;
    }

    .drop-area::before {
      top: 12px;
      left: 12px;

      border-top: 1px solid var(--olive-light);
      border-left: 1px solid var(--olive-light);
    }

    .drop-area::after {
      right: 12px;
      bottom: 12px;

      border-right: 1px solid var(--olive-light);
      border-bottom: 1px solid var(--olive-light);
    }

    .drop-area:hover,
    .drop-area.dragover {
      border-color: var(--olive);

      background:
        rgba(105,112,77,0.055);

      box-shadow:
        inset 0 0 0 4px rgba(105,112,77,0.025);
    }

    .drop-area.dragover {
      transform: scale(1.005);
    }

    .specimen-mark {
      margin-bottom: 18px;

      width: 54px;
      height: 54px;

      border: 1px solid var(--olive-light);

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--olive);

      font-family: Georgia, serif;
      font-size: 25px;

      transform: rotate(45deg);
    }

    .specimen-mark span {
      transform: rotate(-45deg);
    }

    .drop-title {
      color: var(--olive-dark);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 19px;
      letter-spacing: 0.08em;
    }

    .drop-subtitle {
      margin-top: 9px;

      color: var(--muted);

      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .drop-note {
      margin-top: 22px;

      color: var(--muted);

      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input[type="file"] {
      display: none;
    }

    /* =========================
       STATUS
       ========================= */

    .status {
      display: none;

      margin-top: 30px;
      padding: 11px 2px;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);

      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .status-code {
      color: var(--olive);

      font-family: Georgia, serif;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .status-count {
      color: var(--muted);

      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .clear-button {
      border: none;
      background: none;

      color: var(--olive-dark);

      font-size: 10px;
      letter-spacing: 0.12em;

      cursor: pointer;

      padding: 6px 0;
    }

    .clear-button:hover {
      color: var(--olive);
      text-decoration: underline;
    }

    /* =========================
       FILE LIST
       ========================= */

    .file-list {
      margin-top: 15px;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .file-card {
      position: relative;

      background: var(--paper-light);

      border: 1px solid var(--line);

      padding: 15px;

      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 17px;
      align-items: center;

      box-shadow:
        0 2px 8px var(--shadow);

      animation: appear 0.25s ease;
    }

    .file-card::before {
      content: "SPECIMEN";

      position: absolute;
      top: 7px;
      right: 10px;

      color: var(--line-dark);

      font-size: 7px;
      letter-spacing: 0.15em;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .thumbnail-wrap {
      position: relative;

      width: 88px;
      height: 88px;

      background: var(--paper-dark);

      border: 1px solid var(--line);
      padding: 4px;
    }

    .thumbnail {
      width: 100%;
      height: 100%;

      object-fit: cover;

      background: var(--paper);

      display: block;
    }

    .file-info {
      min-width: 0;

      padding-top: 4px;
    }

    .specimen-id {
      margin-bottom: 5px;

      color: var(--olive);

      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .file-name {
      max-width: 100%;

      color: var(--text);

      font-size: 14px;
      font-weight: 500;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      margin-bottom: 8px;
    }

    .file-meta {
      color: var(--muted);

      font-size: 11px;
      line-height: 1.75;
    }

    .compression {
      margin-top: 4px;

      color: var(--olive-dark);

      font-size: 11px;
      letter-spacing: 0.03em;
    }

    .download-button {
      border: 1px solid var(--line-dark);

      background: transparent;

      color: var(--olive-dark);

      padding: 9px 13px;

      font-size: 10px;
      letter-spacing: 0.08em;

      cursor: pointer;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .download-button:hover {
      background: var(--olive);
      border-color: var(--olive);
      color: white;
    }

    /* =========================
       FOOTER
       ========================= */

    .privacy {
      margin-top: 34px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-top: 1px solid var(--line);

      padding-top: 13px;

      color: var(--muted);

      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .privacy-main::before {
      content: "●";

      margin-right: 7px;

      color: var(--olive);
      font-size: 7px;
    }

    .archive-code {
      color: var(--line-dark);
      letter-spacing: 0.14em;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 30px 15px 40px;
      }

      .archive-top {
        font-size: 8px;
      }

      .title-area {
        padding: 22px 2px 16px;
      }

      .title-row {
        gap: 11px;
      }

      .mineral-icon {
        width: 34px;
        height: 41px;
      }

      .drop-area {
        min-height: 225px;
      }

      .file-card {
        grid-template-columns: 64px 1fr;
        gap: 13px;

        padding: 13px;
      }

      .thumbnail-wrap {
        width: 64px;
        height: 64px;
      }

      .download-button {
        grid-column: 2;

        justify-self: start;

        margin-top: 1px;
      }

      .file-card::before {
        display: none;
      }

      .privacy {
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>

      <div class="archive-top">
        <span>YUCHUAN SPECIMEN ROOM</span>
        <span class="archive-number">ARCHIVE · 01</span>
      </div>

      <div class="title-area">

        <div class="eyebrow">
          Image Processing Archive
        </div>

        <div class="title-row">

          <div class="mineral-icon" aria-hidden="true">

            <svg viewBox="0 0 50 58">

              <!-- 外輪廓 -->
              <polygon points="25,3 39,14 43,34 30,53 14,48 7,30 11,13"></polygon>

              <!-- 晶體切面 -->
              <line x1="25" y1="3" x2="25" y2="29"></line>
              <line x1="11" y1="13" x2="25" y2="29"></line>
              <line x1="39" y1="14" x2="25" y2="29"></line>
              <line x1="7" y1="30" x2="25" y2="29"></line>
              <line x1="43" y1="34" x2="25" y2="29"></line>
              <line x1="14" y1="48" x2="25" y2="29"></line>
              <line x1="30" y1="53" x2="25" y2="29"></line>

              <!-- 內部小切面 -->
              <line x1="25" y1="3" x2="39" y2="14"></line>
              <line x1="11" y1="13" x2="39" y2="14"></line>

            </svg>

          </div>

          <h1>
            圖片處理標本室
          </h1>

        </div>

        <div class="title-en">
          Image Specimen Room
        </div>



      </div>

    </header>


    <div class="section-label">
      Specimen Intake · 標本入庫
    </div>


    <label
      class="drop-area"
      id="drop-area"
      for="file-input"
    >

      <div class="specimen-mark">
        <span>⌁</span>
      </div>

      <div class="drop-title">
        選擇圖片
      </div>

      <div class="drop-subtitle">
        或將圖片拖曳至此
      </div>

      <div class="drop-note">
        JPG · PNG · HEIC · Multiple Images
      </div>

    </label>


    <input
      id="file-input"
      type="file"
      accept="image/*"
      multiple
    >


    <div
      class="status"
      id="status"
    >

      <div class="status-left">

        <span class="status-code">
          RECORD
        </span>

        <span
          class="status-count"
          id="status-count"
        >
          已選擇 0 張圖片
        </span>

      </div>

      <button
        class="clear-button"
        id="clear-button"
        type="button"
      >
        CLEAR ALL
      </button>

    </div>


    <div
      class="file-list"
      id="file-list"
    ></div>


    <div class="privacy">

      <span class="privacy-main">
        圖片會在本機處理，不上傳至伺服器
      </span>

      <span class="archive-code">
        YC-IMG-001 · 2026
      </span>

    </div>

  </main>


  <script>

    const fileInput =
      document.getElementById("file-input");

    const dropArea =
      document.getElementById("drop-area");

    const fileList =
      document.getElementById("file-list");

    const status =
      document.getElementById("status");

    const statusCount =
      document.getElementById("status-count");

    const clearButton =
      document.getElementById("clear-button");

    let compressedFiles = [];


    fileInput.addEventListener(
      "change",
      function () {

        handleFiles(fileInput.files);

        fileInput.value = "";

      }
    );


    dropArea.addEventListener(
      "dragover",
      function (event) {

        event.preventDefault();

        dropArea.classList.add("dragover");

      }
    );


    dropArea.addEventListener(
      "dragleave",
      function () {

        dropArea.classList.remove("dragover");

      }
    );


    dropArea.addEventListener(
      "drop",
      function (event) {

        event.preventDefault();

        dropArea.classList.remove("dragover");

        handleFiles(event.dataTransfer.files);

      }
    );


    clearButton.addEventListener(
      "click",
      function () {

        compressedFiles.forEach(
          function (item) {

            if (item.url) {
              URL.revokeObjectURL(item.url);
            }

          }
        );

        compressedFiles = [];

        fileList.innerHTML = "";

        status.style.display = "none";

      }
    );


    function handleFiles(files) {

      const imageFiles =
        Array.from(files).filter(
          function (file) {

            return file.type.startsWith("image/");

          }
        );


      if (imageFiles.length === 0) {
        return;
      }


      imageFiles.forEach(
        function (file) {

          compressImage(file);

        }
      );

    }


    function compressImage(file) {

      const image =
        new Image();


      const imageURL =
        URL.createObjectURL(file);


      image.onload =
        function () {

          const maxWidth = 1600;

          const maxHeight = 1600;


          let width = image.width;

          let height = image.height;


          if (
            width > maxWidth ||
            height > maxHeight
          ) {

            const scale =
              Math.min(
                maxWidth / width,
                maxHeight / height
              );


            width =
              Math.round(width * scale);


            height =
              Math.round(height * scale);

          }


          const canvas =
            document.createElement("canvas");


          canvas.width = width;

          canvas.height = height;


          const ctx =
            canvas.getContext("2d");


          ctx.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            function (blob) {

              URL.revokeObjectURL(imageURL);


              if (!blob) {
                return;
              }


              const compressedURL =
                URL.createObjectURL(blob);


              const percentage =
                Math.round(
                  (1 - blob.size / file.size) * 100
                );


              const savedPercentage =
                Math.max(
                  0,
                  percentage
                );


              const item = {

                originalName:
                  file.name,

                originalSize:
                  file.size,

                compressedSize:
                  blob.size,

                percentage:
                  savedPercentage,

                blob:
                  blob,

                url:
                  compressedURL

              };


              compressedFiles.push(item);


              createFileCard(item);


              updateStatus();

            },
            "image/jpeg",
            0.75
          );

        };


      image.onerror =
        function () {

          URL.revokeObjectURL(imageURL);

        };


      image.src =
        imageURL;

    }


    function createFileCard(item) {

      const card =
        document.createElement("div");


      card.className =
        "file-card";


      const thumbnailWrap =
        document.createElement("div");


      thumbnailWrap.className =
        "thumbnail-wrap";


      const thumbnail =
        document.createElement("img");


      thumbnail.className =
        "thumbnail";


      thumbnail.src =
        item.url;


      thumbnail.alt =
        item.originalName;


      thumbnailWrap.appendChild(thumbnail);


      const info =
        document.createElement("div");


      info.className =
        "file-info";


      const specimenID =
        document.createElement("div");


      specimenID.className =
        "specimen-id";


      specimenID.textContent =
        "SPECIMEN "
        + String(compressedFiles.length).padStart(3, "0");


      const name =
        document.createElement("div");


      name.className =
        "file-name";


      name.textContent =
        item.originalName;


      const meta =
        document.createElement("div");


      meta.className =
        "file-meta";


      meta.innerHTML =
        "原始大小："
        + formatSize(item.originalSize)
        + "<br>"
        + "壓縮後："
        + formatSize(item.compressedSize);


      const compression =
        document.createElement("div");


      compression.className =
        "compression";


      compression.textContent =
        "節省 "
        + item.percentage
        + "%";


      meta.appendChild(compression);


      info.appendChild(specimenID);

      info.appendChild(name);

      info.appendChild(meta);


      const downloadButton =
        document.createElement("button");


      downloadButton.className =
        "download-button";


      downloadButton.type =
        "button";


      downloadButton.textContent =
        "DOWNLOAD ↓";


      downloadButton.addEventListener(
        "click",
        function () {

          downloadFile(item);

        }
      );


      card.appendChild(thumbnailWrap);

      card.appendChild(info);

      card.appendChild(downloadButton);


      fileList.appendChild(card);

    }


    function downloadFile(item) {

      const link =
        document.createElement("a");


      link.href =
        item.url;


      link.download =
        createDownloadName(
          item.originalName
        );


      document.body.appendChild(link);


      link.click();


      document.body.removeChild(link);

    }


    function createDownloadName(filename) {

      const lastDot =
        filename.lastIndexOf(".");


      if (lastDot === -1) {

        return filename
          + "_compressed.jpg";

      }


      return (
        filename.substring(0, lastDot)
        + "_compressed.jpg"
      );

    }


    function updateStatus() {

      status.style.display =
        "flex";


      statusCount.textContent =
        "已選擇 "
        + compressedFiles.length
        + " 張圖片";

    }


    function formatSize(bytes) {

      if (bytes >= 1024 * 1024) {

        return (
          (bytes / (1024 * 1024)).toFixed(2)
          + " MB"
        );

      }


      if (bytes >= 1024) {

        return (
          (bytes / 1024).toFixed(0)
          + " KB"
        );

      }


      return (
        bytes
        + " B"
      );

    }

  </script>

</body>
</html>
