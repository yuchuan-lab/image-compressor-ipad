<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>圖片壓縮工具｜嶼川標本室</title>

  <style>
    :root {
      --cream: #F7F3E8;
      --paper: #FCFAF2;
      --olive: #68704A;
      --olive-dark: #4E5537;
      --text: #3F4138;
      --muted: #898B7C;
      --border: #D8D5C6;
      --border-dark: #BDB9A8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang TC",
        "Helvetica Neue",
        sans-serif;

      padding: 48px 20px;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    /* ─────────────
       Header
    ───────────── */

    header {
      text-align: center;
      margin-bottom: 42px;
    }

    .label {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--olive);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.04em;
    }

    /* ─────────────
       Drop Area
    ───────────── */

    .drop-area {
      min-height: 250px;

      background: rgba(252, 250, 242, 0.55);

      border: 1.5px dashed var(--border-dark);
      border-radius: 18px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .drop-area:hover,
    .drop-area.dragover {
      border-color: var(--olive);
      background: rgba(104, 112, 74, 0.06);
    }

    .drop-area.dragover {
      transform: scale(1.01);
    }

    .drop-icon {
      width: 54px;
      height: 54px;

      border: 1px solid var(--border-dark);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      color: var(--olive);

      margin-bottom: 20px;
    }

    .drop-title {
      font-size: 18px;
      color: var(--olive-dark);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .drop-subtitle {
      margin-top: 9px;
      font-size: 13px;
      color: var(--muted);
    }

    input[type="file"] {
      display: none;
    }

    /* ─────────────
       Status
    ───────────── */

    .status {
      display: none;

      margin-top: 28px;
      padding-bottom: 12px;

      border-bottom: 1px solid var(--border);

      align-items: center;
      justify-content: space-between;
    }

    .status-count {
      font-size: 13px;
      color: var(--muted);
    }

    .clear-button {
      border: none;
      background: none;

      color: var(--olive-dark);

      font-size: 12px;
      letter-spacing: 0.06em;

      cursor: pointer;

      padding: 6px 0;
    }

    .clear-button:hover {
      text-decoration: underline;
    }

    /* ─────────────
       File Cards
    ───────────── */

    .file-list {
      margin-top: 16px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-card {
      background: var(--paper);

      border: 1px solid var(--border);
      border-radius: 12px;

      padding: 16px;

      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 16px;

      align-items: center;

      animation: appear 0.25s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .thumbnail {
      width: 72px;
      height: 72px;

      border-radius: 8px;

      object-fit: cover;

      background: var(--cream);

      border: 1px solid var(--border);
    }

    .file-info {
      min-width: 0;
    }

    .file-name {
      font-size: 14px;
      font-weight: 500;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      margin-bottom: 8px;
    }

    .file-meta {
      font-size: 12px;
      color: var(--muted);

      line-height: 1.7;
    }

    .compression {
      margin-top: 3px;
      color: var(--olive);
    }

    .download-button {
      border: 1px solid var(--border-dark);

      background: transparent;

      color: var(--olive-dark);

      border-radius: 7px;

      padding: 8px 12px;

      font-size: 12px;

      cursor: pointer;

      white-space: nowrap;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .download-button:hover {
      background: var(--olive);
      color: white;
    }

    /* ─────────────
       Footer
    ───────────── */

    .privacy {
      margin-top: 26px;

      text-align: center;

      font-size: 11px;
      color: var(--muted);

      letter-spacing: 0.03em;
    }

    .privacy::before {
      content: "✦";
      margin-right: 7px;
      color: var(--olive);
    }

    /* ─────────────
       Mobile
    ───────────── */

    @media (max-width: 600px) {

      body {
        padding: 32px 16px;
      }

      h1 {
        font-size: 27px;
      }

      .drop-area {
        min-height: 220px;
      }

      .file-card {
        grid-template-columns: 58px 1fr;
      }

      .thumbnail {
        width: 58px;
        height: 58px;
      }

      .download-button {
        grid-column: 2;
        justify-self: start;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>

      <div class="label">
        YUCHUAN SPECIMEN ROOM · 01
      </div>

      <h1>
        圖片壓縮工具
      </h1>

      <div class="subtitle">
        Compress for Goodnotes
      </div>

    </header>


    <!-- Upload Area -->

    <label
      class="drop-area"
      id="drop-area"
      for="file-input"
    >

      <div class="drop-icon">
        ⌁
      </div>

      <div class="drop-title">
        選擇圖片
      </div>

      <div class="drop-subtitle">
        或將圖片拖曳至此
      </div>

    </label>


    <input
      id="file-input"
      type="file"
      accept="image/*"
      multiple
    >


    <!-- Status -->

    <div
      class="status"
      id="status"
    >

      <div
        class="status-count"
        id="status-count"
      >
        已選擇 0 張圖片
      </div>

      <button
        class="clear-button"
        id="clear-button"
        type="button"
      >
        CLEAR ALL
      </button>

    </div>


    <!-- File List -->

    <div
      class="file-list"
      id="file-list"
    ></div>


    <div class="privacy">
      圖片會在本機處理，不上傳至伺服器
    </div>

  </main>


  <script>

    const fileInput =
      document.getElementById("file-input");

    const dropArea =
      document.getElementById("drop-area");

    const fileList =
      document.getElementById("file-list");

    const status =
      document.getElementById("status");

    const statusCount =
      document.getElementById("status-count");

    const clearButton =
      document.getElementById("clear-button");


    /*
     * Store all compressed images here.
     */

    let compressedFiles = [];


    /*
     * File selection
     */

    fileInput.addEventListener(
      "change",
      function () {

        handleFiles(fileInput.files);

        /*
         * Reset input so selecting the
         * same file again still works.
         */

        fileInput.value = "";

      }
    );


    /*
     * Drag & Drop
     */

    dropArea.addEventListener(
      "dragover",
      function (event) {

        event.preventDefault();

        dropArea.classList.add("dragover");

      }
    );


    dropArea.addEventListener(
      "dragleave",
      function () {

        dropArea.classList.remove("dragover");

      }
    );


    dropArea.addEventListener(
      "drop",
      function (event) {

        event.preventDefault();

        dropArea.classList.remove("dragover");

        handleFiles(event.dataTransfer.files);

      }
    );


    /*
     * Clear all
     */

    clearButton.addEventListener(
      "click",
      function () {

        compressedFiles.forEach(
          function (item) {

            if (item.url) {
              URL.revokeObjectURL(item.url);
            }

          }
        );

        compressedFiles = [];

        fileList.innerHTML = "";

        status.style.display = "none";

      }
    );


    /*
     * Handle multiple files
     */

    function handleFiles(files) {

      const imageFiles =
        Array.from(files).filter(
          function (file) {

            return file.type.startsWith("image/");

          }
        );


      if (imageFiles.length === 0) {
        return;
      }


      imageFiles.forEach(
        function (file) {

          compressImage(file);

        }
      );

    }


    /*
     * Compress image
     */

    function compressImage(file) {

      const image =
        new Image();

      const imageURL =
        URL.createObjectURL(file);


      image.onload =
        function () {

          const maxWidth = 1600;
          const maxHeight = 1600;

          let width = image.width;
          let height = image.height;


          /*
           * Keep original proportions
           * while limiting dimensions.
           */

          if (
            width > maxWidth ||
            height > maxHeight
          ) {

            const scale =
              Math.min(
                maxWidth / width,
                maxHeight / height
              );

            width =
              Math.round(width * scale);

            height =
              Math.round(height * scale);

          }


          const canvas =
            document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;


          const ctx =
            canvas.getContext("2d");

          ctx.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            function (blob) {

              URL.revokeObjectURL(imageURL);


              if (!blob) {
                return;
              }


              const compressedURL =
                URL.createObjectURL(blob);


              const percentage =
                Math.round(
                  (1 - blob.size / file.size) * 100
                );


              const savedPercentage =
                Math.max(
                  0,
                  percentage
                );


              const item = {

                originalName:
                  file.name,

                originalSize:
                  file.size,

                compressedSize:
                  blob.size,

                percentage:
                  savedPercentage,

                blob:
                  blob,

                url:
                  compressedURL

              };


              compressedFiles.push(item);

              createFileCard(item);

              updateStatus();

            },
            "image/jpeg",
            0.75
          );

        };


      image.onerror =
        function () {

          URL.revokeObjectURL(imageURL);

        };


      image.src =
        imageURL;

    }


    /*
     * Create file card
     */

    function createFileCard(item) {

      const card =
        document.createElement("div");

      card.className =
        "file-card";


      const thumbnail =
        document.createElement("img");

      thumbnail.className =
        "thumbnail";

      thumbnail.src =
        item.url;

      thumbnail.alt =
        item.originalName;


      const info =
        document.createElement("div");

      info.className =
        "file-info";


      const name =
        document.createElement("div");

      name.className =
        "file-name";

      name.textContent =
        item.originalName;


      const meta =
        document.createElement("div");

      meta.className =
        "file-meta";


      meta.innerHTML =
        "原始大小："
        + formatSize(item.originalSize)
        + "<br>"
        + "壓縮後："
        + formatSize(item.compressedSize);


      const compression =
        document.createElement("div");

      compression.className =
        "compression";

      compression.textContent =
        "節省 "
        + item.percentage
        + "%";


      meta.appendChild(compression);

      info.appendChild(name);
      info.appendChild(meta);


      const downloadButton =
        document.createElement("button");

      downloadButton.className =
        "download-button";

      downloadButton.type =
        "button";

      downloadButton.textContent =
        "下載 ↓";


      downloadButton.addEventListener(
        "click",
        function () {

          downloadFile(item);

        }
      );


      card.appendChild(thumbnail);
      card.appendChild(info);
      card.appendChild(downloadButton);


      fileList.appendChild(card);

    }


    /*
     * Download compressed image
     */

    function downloadFile(item) {

      const link =
        document.createElement("a");

      link.href =
        item.url;

      link.download =
        createDownloadName(
          item.originalName
        );

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

    }


    /*
     * Create output filename
     */

    function createDownloadName(filename) {

      const lastDot =
        filename.lastIndexOf(".");


      if (lastDot === -1) {

        return filename + "_compressed.jpg";

      }


      return (
        filename.substring(0, lastDot)
        + "_compressed.jpg"
      );

    }


    /*
     * Update status
     */

    function updateStatus() {

      status.style.display =
        "flex";


      statusCount.textContent =
        "已選擇 "
        + compressedFiles.length
        + " 張圖片";

    }


    /*
     * Format file size
     */

    function formatSize(bytes) {

      if (bytes >= 1024 * 1024) {

        return (
          (bytes / (1024 * 1024)).toFixed(2)
          + " MB"
        );

      }


      if (bytes >= 1024) {

        return (
          (bytes / 1024).toFixed(0)
          + " KB"
        );

      }


      return (
        bytes
        + " B"
      );

    }

  </script>

</body>
</html>
